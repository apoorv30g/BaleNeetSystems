# Production deployment for a single VPS in an India region (e.g. DigitalOcean BLR1 / Vultr Mumbai).
# Replaces the Railway-managed setup: all app services plus Postgres and Redis on one box.
#
# This is SEPARATE from docker-compose.yml, which stays as the local-development convenience
# stack (Postgres + Redis only, published on localhost for `npm run dev`).
#
# Usage on the server:
#   cp .env.example .env      # then fill in real values
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend-api npm run migrate
#
# TLS and routing are handled by the caddy service below (ops/Caddyfile), which obtains
# Let's Encrypt certificates automatically. Ports 80/443 must be open and DNS must already
# point here.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing certs on restart, which
      # can hit Let's Encrypt rate limits -- keep it.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      backend-api:
        condition: service_started
      dashboard-web:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Tuned for a small (2-4GB) shared box. Postgres defaults assume it owns the machine; here
    # it shares with Redis and three Node processes.
    #   max_connections 50  — pool.js caps at 20 per service (backend + worker = 40 worst case)
    #   shared_buffers 256MB — ~12% of a 2GB box; the working set is tiny (DB is ~150MB)
    #   work_mem 8MB        — deliberately low: it is per-sort, not per-connection
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loanconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-loanconnect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately NOT published to the host -- reachable only on the compose network.
    # For a shell: docker compose -f docker-compose.prod.yml exec postgres psql -U loanconnect
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loanconnect} -d ${POSTGRES_DB:-loanconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --appendonly: BullMQ jobs are re-derivable from the DB, but AOF avoids losing an
    #   in-flight queue on reboot.
    # --maxmemory: hard ceiling so Redis can never starve Postgres and the Node services on a
    #   small box. 256MB is generous for this queue volume.
    # --maxmemory-policy noeviction: REQUIRED for BullMQ. Any eviction policy would silently
    #   discard job data — a dropped job means a borrower never gets called and nothing reports
    #   it. Failing the write loudly instead is the correct trade.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: .
      dockerfile: apps/backend-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-loanconnect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loanconnect}
      REDIS_URL: redis://redis:6379
    # Bound to loopback: the reverse proxy terminates TLS and forwards here.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-loanconnect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loanconnect}
      REDIS_URL: redis://redis:6379
      # Preflight hits backend-api over the internal network, not the public URL.
      SARVAM_PREFLIGHT_URL: http://backend-api:4000/webhooks/exotel/voicebot-preflight
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time.
        # Changing this requires a rebuild, not just a restart.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set to your public API URL, e.g. https://api.baleneetsystems.in}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend-api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  caddy_logs:
